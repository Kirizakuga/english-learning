<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grammar to Band 9</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Visual grammar lessons and practice for IELTS, from Band 5 to Band 9.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Neo-brutalist exercise book: squared paper, ink outlines, hard slab shadows.
   The one loud thing is the "sentence machine": every grammar role has one block colour,
   used in the logo, the lessons and nowhere else. Yellow highlighter = what matters now. */
:root {
  --paper: #EDF0FA;      /* squared exercise-book paper */
  --grid: #D8DDF1;
  --card: #FFFFFF;
  --ink: #000000;
  --sub: #474D66;
  --shadow: #000000;
  --mark: #FFD43B;       /* highlighter: primary action, Mastered */
  --on-color: #000000;   /* text on any coloured block */
  --ok: #3BD679;
  --bad: #FF6464;
  --ok-tint: #D3F7E2;
  --bad-tint: #FFE0E0;
  /* grammar roles — fixed everywhere */
  --role-s: #6C97FF;
  --role-aux: #FFA23A;
  --role-v: #FF78B0;
  --role-o: #A6E85B;
  --role-x: #C7B8FF;
  --role-c: #3ED9C3;

  --f-display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --border: 3px;
  --lift: 5px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #161826; --grid: #23263A; --card: #22253B; --ink: #F3F1E8; --sub: #B6BAD2;
    --shadow: #F3F1E8; --mark: #FFD43B; --ok: #3BD679; --bad: #FF6B6B;
    --ok-tint: #1C3B2B; --bad-tint: #47222A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #161826; --grid: #23263A; --card: #22253B; --ink: #F3F1E8; --sub: #B6BAD2;
  --shadow: #F3F1E8; --mark: #FFD43B; --ok: #3BD679; --bad: #FF6B6B;
  --ok-tint: #1C3B2B; --bad-tint: #47222A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 26px 26px;
  color: var(--ink);
  font: 400 1rem/1.55 var(--f-body);
  min-height: 100vh;
}
#app {
  max-width: 1120px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 64px;
}
h1, h2, h3 { font-family: var(--f-display); line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(2rem, 6vw, 3.25rem); font-weight: 800; font-stretch: 82%; }
h2 { font-size: 1.5rem; font-weight: 800; font-stretch: 88%; }
h3 { font-size: 1.125rem; font-weight: 700; }
p { margin: 0; }
a { color: inherit; }
[lang="vi"] { font-family: var(--f-body); }
:focus-visible { outline: 3px solid var(--role-s); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- primitives ---------- */
.slab {
  background: var(--card);
  border: var(--border) solid var(--ink);
  border-radius: 14px;
  box-shadow: var(--lift) var(--lift) 0 var(--shadow);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px; padding: 0 20px;
  font: 700 1.0625rem/1.1 var(--f-display); font-stretch: 92%;
  color: var(--ink); background: var(--card);
  border: var(--border) solid var(--ink); border-radius: 10px;
  box-shadow: 4px 4px 0 var(--shadow);
  cursor: pointer; text-decoration: none;
  transition: transform .08s ease, box-shadow .08s ease;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--shadow); }
.btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--shadow); }
.btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; box-shadow: 2px 2px 0 var(--shadow); }
.btn-mark { background: var(--mark); color: var(--on-color); }
.btn-ink { background: var(--ink); color: var(--card); }
.btn-xl { min-height: 64px; font-size: 1.375rem; padding: 0 28px; border-radius: 12px; box-shadow: 6px 6px 0 var(--shadow); }
.btn-xl:active { transform: translate(6px, 6px); }
.btn-ghost { box-shadow: none; background: transparent; }
.btn-ghost:hover { box-shadow: none; transform: none; background: var(--card); }
.count {
  display: inline-grid; place-items: center; min-width: 28px; height: 28px; padding: 0 6px;
  background: var(--ink); color: var(--card); border-radius: 6px; font-size: .9375rem;
}

/* sentence-machine chips */
.chip {
  display: inline-block;
  padding: 6px 12px;
  font: 700 1rem/1.2 var(--f-display); font-stretch: 90%;
  color: var(--on-color);
  border: var(--border) solid var(--ink);
  border-radius: 5px;
  box-shadow: 3px 3px 0 var(--shadow);
}
.r-s { background: var(--role-s); }
.r-aux { background: var(--role-aux); }
.r-v { background: var(--role-v); }
.r-o { background: var(--role-o); }
.r-x { background: var(--role-x); }
.r-c { background: var(--role-c); }

/* ---------- masthead ---------- */
.masthead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
.brand { display: flex; flex-wrap: wrap; gap: 6px; text-decoration: none; }
.brand .chip { font-size: 1.0625rem; padding: 5px 10px; }
.brand .chip:nth-child(1) { transform: rotate(-2deg); }
.brand .chip:nth-child(3) { transform: rotate(1.5deg); }
.icon-btn { width: 48px; padding: 0; font-size: 1.25rem; }

/* ---------- home ---------- */
.today { display: grid; gap: 20px; padding: 24px; margin-bottom: 36px; }
.today-top { display: grid; gap: 20px; grid-template-columns: 1fr; }
.hello p { color: var(--sub); margin-top: 10px; max-width: 46ch; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin: 0; border: var(--border) solid var(--ink); border-radius: 10px; overflow: hidden; }
.stat { padding: 12px 14px; border-left: var(--border) solid var(--ink); min-width: 0; }
.stat:first-child { border-left: 0; }
.stat dt { font-size: .8125rem; color: var(--sub); line-height: 1.3; }
.stat dd { margin: 0 0 2px; font: 800 2rem/1 var(--f-display); font-variant-numeric: tabular-nums; order: -1; }
.stat { display: flex; flex-direction: column; }
.stat dd small { font-size: .5em; color: var(--sub); font-weight: 700; margin-left: 2px; }
.plan { display: grid; gap: 10px; }
.plan-strip { display: flex; gap: 6px; }
.plan-step {
  min-width: 0; padding: 8px 10px; border: var(--border) solid var(--ink); border-radius: 8px;
  background: var(--card); display: flex; flex-direction: column; gap: 2px;
}
.plan-step b { font: 700 .9375rem/1.15 var(--f-display); font-stretch: 90%; }
.plan-step span { font-size: .8125rem; color: var(--sub); font-variant-numeric: tabular-nums; }
.plan-note { font-size: .9375rem; color: var(--sub); }
.plan-note strong { color: var(--ink); }
.cta-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
@media (min-width: 820px) {
  .today-top { grid-template-columns: 1.1fr 1fr; align-items: end; }
}
@media (max-width: 480px) {
  .today { padding: 18px; }
  .plan-strip { display: grid; grid-template-columns: 1fr 1fr; }
  .cta-row .btn { width: 100%; }
  .stat dd { font-size: 1.625rem; }
}

.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.section-head p { color: var(--sub); font-size: .9375rem; }
.suggest { margin-bottom: 40px; }
.suggest-row { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.suggest-card { display: grid; gap: 6px; padding: 16px; text-decoration: none; }
.suggest-card .why { font-size: .875rem; color: var(--sub); }
.suggest-card .why strong { color: var(--ink); }

.band { margin-bottom: 40px; }
.band-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.band-num {
  font: 800 1.125rem/1 var(--f-display); font-stretch: 85%;
  padding: 8px 12px; background: var(--ink); color: var(--card); border-radius: 6px;
  font-variant-numeric: tabular-nums;
}
.band-head p { color: var(--sub); font-size: .9375rem; margin-left: auto; font-variant-numeric: tabular-nums; }
.tiles { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); }
@media (max-width: 480px) { .tiles { grid-template-columns: 1fr 1fr; gap: 12px; } }
.tile {
  position: relative; display: flex; flex-direction: column; gap: 6px;
  padding: 14px; min-height: 150px; text-decoration: none;
  background: var(--card); border: var(--border) solid var(--ink); border-radius: 12px;
  box-shadow: 4px 4px 0 var(--shadow);
  transition: transform .08s ease, box-shadow .08s ease;
}
.tile:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--shadow); }
.tile:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--shadow); }
.tile.lvl-3 { background: var(--mark); color: var(--on-color); }
.tile.lvl-3 .tile-vi { color: var(--on-color); opacity: .72; }
.tile-title { font: 700 1.0625rem/1.15 var(--f-display); font-stretch: 92%; }
.tile-vi { font-size: .8125rem; color: var(--sub); line-height: 1.35; }
.tile-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 6px; }
.ring { width: 34px; height: 34px; flex: none; }
.ring .track { stroke: var(--grid); }
.ring .fill { stroke: var(--ink); }
.tile.lvl-3 .ring .track { stroke: rgba(0,0,0,.15); }
.tile.lvl-3 .ring .fill { stroke: var(--on-color); }
.prio { position: absolute; top: -10px; right: 10px; font: 700 .75rem/1 var(--f-display); padding: 4px 7px; background: var(--bad); color: var(--on-color); border: 2px solid var(--ink); border-radius: 5px; }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font: 700 .8125rem/1 var(--f-display); font-stretch: 90%;
  padding: 5px 8px; border: 2px solid var(--ink); border-radius: 5px; white-space: nowrap;
  background: var(--card); color: var(--ink);
}
.badge.lvl-1 { background: repeating-linear-gradient(-45deg, var(--card) 0 5px, var(--grid) 5px 10px); }
.badge.lvl-2 { background: var(--ink); color: var(--card); }
.badge.lvl-3 { background: var(--card); color: var(--ink); }
.tile.lvl-3 .badge.lvl-3 { background: #000; color: var(--mark); border-color: #000; }
.refresh { font-size: .75rem; color: var(--sub); font-style: italic; }

/* ---------- lesson ---------- */
.back { margin-bottom: 20px; }
.lesson { display: grid; gap: 28px; }
.lesson > *, .stage > *, .summary > *, .today > *, .pair > * { min-width: 0; }
.lesson-head { display: grid; gap: 10px; }
.lesson-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--sub); font-size: .9375rem; }
.lesson-vi { font-size: 1.0625rem; color: var(--sub); }
.rule { font-size: 1.1875rem; line-height: 1.5; max-width: 60ch; }
.machine { padding: 22px 20px 18px; display: grid; gap: 22px; }
.machine-label { font: 700 .9375rem/1 var(--f-display); color: var(--sub); }
.formula { display: flex; flex-wrap: wrap; gap: 14px 10px; align-items: flex-start; }
.part { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.part .chip { font-size: 1.1875rem; padding: 10px 14px; }
.part small { font-size: .75rem; color: var(--sub); padding-left: 2px; }
.formula + .formula { padding-top: 18px; border-top: 3px dashed var(--grid); }

.timeline { padding: 18px 16px 10px; }
.timeline svg { width: 100%; max-width: 720px; height: auto; display: block; color: var(--ink); overflow: visible; }
.timeline text { font-family: var(--f-display); font-weight: 700; }
.timeline text.end { font-family: var(--f-body); font-weight: 400; }
.tl-wrap { overflow-x: auto; }
.tl-wrap svg { min-width: 300px; }

.pair { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.example { overflow: hidden; }
.example-head { display: flex; align-items: center; gap: 8px; padding: 10px 16px; font: 800 1.0625rem/1 var(--f-display); border-bottom: var(--border) solid var(--ink); color: var(--on-color); }
.example.wrong .example-head { background: var(--bad); }
.example.right .example-head { background: var(--ok); }
.example p { padding: 16px; font-size: 1.25rem; line-height: 1.5; }
.example del { text-decoration: line-through 3px var(--bad); background: var(--bad-tint); padding: 1px 3px; border-radius: 3px; }
.example ins { text-decoration: none; background: var(--ok-tint); border-bottom: 3px solid var(--ok); padding: 1px 3px; border-radius: 3px 3px 0 0; font-weight: 700; }

.tip {
  justify-self: start; max-width: 60ch; padding: 16px 18px;
  background: var(--mark); color: var(--on-color);
  border: var(--border) solid var(--ink); border-radius: 4px;
  box-shadow: var(--lift) var(--lift) 0 var(--shadow);
  transform: rotate(-0.8deg);
}
.tip b { font-family: var(--f-display); font-size: 1.0625rem; display: block; margin-bottom: 4px; }
.lesson-actions { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.lesson-actions p { color: var(--sub); font-size: .9375rem; }

/* ---------- practice ---------- */
.sbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 12px; margin-bottom: 18px;
  background: var(--card); border: var(--border) solid var(--ink); border-radius: 12px;
  box-shadow: 4px 4px 0 var(--shadow);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.sbar .where { flex: 1 1 160px; min-width: 0; }
.sbar .where b { display: block; font: 700 1rem/1.2 var(--f-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sbar .where span { font-size: .8125rem; color: var(--sub); }
.meters { display: flex; gap: 6px; }
.meter { min-width: 58px; padding: 4px 8px; border: 2px solid var(--ink); border-radius: 6px; text-align: center; }
.meter b { display: block; font: 800 1.0625rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.meter span { font-size: .6875rem; color: var(--sub); }
.sbar .btn { min-height: 44px; padding: 0 12px; font-size: .9375rem; box-shadow: 2px 2px 0 var(--shadow); }
.phases { display: flex; gap: 4px; width: 100%; }
.phases span { flex: 1; height: 8px; border: 2px solid var(--ink); border-radius: 3px; background: var(--card); }
.phases span.done { background: var(--ink); }
.phases span.now { background: var(--mark); }

.stage { max-width: 760px; margin: 0 auto; display: grid; gap: 18px; }
.qcard { padding: 22px 20px 20px; display: grid; gap: 18px; }
.qtop { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.qkind { font: 700 1rem/1 var(--f-display); padding: 6px 10px; border: 2px solid var(--ink); border-radius: 6px; }
.qtopic { font-size: .8125rem; color: var(--sub); }
.review-tag { font: 700 .8125rem/1 var(--f-display); padding: 5px 8px; background: var(--role-x); color: var(--on-color); border: 2px solid var(--ink); border-radius: 5px; }
.prompt { font-size: clamp(1.25rem, 3.6vw, 1.625rem); line-height: 1.45; font-weight: 500; }
.prompt.small { font-size: 1.0625rem; color: var(--sub); font-weight: 400; }
.gap {
  display: inline-block; min-width: 3.2em; border-bottom: 4px solid var(--ink);
  text-align: center; line-height: 1.1; padding: 0 4px; font-weight: 700;
}
.gap.filled { background: var(--ok-tint); border-color: var(--ok); }
.prompt mark { background: var(--bad-tint); color: inherit; border: 2px dashed var(--bad); border-radius: 4px; padding: 0 4px; }

.opts { display: grid; gap: 12px; }
.opts.two { grid-template-columns: 1fr 1fr; }
@media (min-width: 640px) { .opts.short { grid-template-columns: 1fr 1fr; } }
.opt {
  display: flex; align-items: center; gap: 12px; text-align: left;
  min-height: 58px; padding: 10px 14px;
  font: 500 1.125rem/1.35 var(--f-body); color: var(--ink);
  background: var(--card); border: var(--border) solid var(--ink); border-radius: 10px;
  box-shadow: 4px 4px 0 var(--shadow); cursor: pointer;
  transition: transform .08s ease, box-shadow .08s ease;
  -webkit-tap-highlight-color: transparent;
}
.opt:hover:not([disabled]) { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--shadow); }
.opt:active:not([disabled]) { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--shadow); }
.opt kbd {
  flex: none; display: grid; place-items: center; width: 30px; height: 30px;
  font: 800 .9375rem/1 var(--f-display); border: 2px solid var(--ink); border-radius: 6px; background: var(--paper);
}
.opt .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt .verdict { flex: none; font: 700 .8125rem/1.1 var(--f-display); text-align: right; }
.opt[disabled] { cursor: default; }
.opt.dim { opacity: .45; box-shadow: 2px 2px 0 var(--shadow); }
.opt.is-right { background: var(--ok); color: var(--on-color); }
.opt.is-wrong { background: var(--bad); color: var(--on-color); }
.opt.is-right kbd, .opt.is-wrong kbd { background: #fff; color: #000; border-color: #000; }
.opt.judge { justify-content: center; font: 800 1.25rem/1 var(--f-display); }

.typed { display: flex; gap: 10px; flex-wrap: wrap; }
.typed input {
  flex: 1 1 220px; min-width: 0; min-height: 56px; padding: 0 14px;
  font: 500 1.25rem var(--f-body); color: var(--ink); background: var(--card);
  border: var(--border) solid var(--ink); border-radius: 10px; box-shadow: inset 3px 3px 0 var(--grid);
}
.typed input.is-right { background: var(--ok-tint); border-color: var(--ok); }
.typed input.is-wrong { background: var(--bad-tint); border-color: var(--bad); }

.feedback { display: grid; gap: 10px; padding-top: 16px; border-top: 3px dashed var(--grid); }
.feedback:empty { display: none; }
.verdict-line { display: flex; align-items: center; gap: 10px; font: 800 1.375rem/1 var(--f-display); }
.verdict-line i { font-style: normal; display: grid; place-items: center; width: 34px; height: 34px; border: var(--border) solid var(--ink); border-radius: 6px; color: var(--on-color); }
.verdict-line.good i { background: var(--ok); }
.verdict-line.bad i { background: var(--bad); }
.fixed { padding: 10px 12px; background: var(--ok-tint); border: 2px solid var(--ok); border-radius: 8px; font-size: 1.0625rem; font-weight: 500; }
.fixed small { display: block; font-size: .75rem; color: var(--sub); font-weight: 400; }
.explain { color: var(--sub); font-size: 1rem; max-width: 62ch; }
.next-row { display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap; }
.next-row .hint { margin-right: auto; align-self: center; font-size: .8125rem; color: var(--sub); }
@media (max-width: 480px) {
  .qcard { padding: 18px 14px 16px; }
  .next-row .btn { width: 100%; }
  .next-row .hint { display: none; }
  .meter { min-width: 50px; }
}
@media (hover: none) { .hint { display: none; } }

/* ---------- summary ---------- */
.summary { max-width: 760px; margin: 0 auto; display: grid; gap: 22px; }
.summary .stats { grid-template-columns: repeat(4, 1fr); background: var(--card); }
@media (max-width: 560px) { .summary .stats { grid-template-columns: 1fr 1fr; } .summary .stat:nth-child(3) { border-left: 0; } .summary .stat:nth-child(n+3) { border-top: var(--border) solid var(--ink); } }
.list { display: grid; gap: 0; padding: 0; margin: 0; list-style: none; }
.list li { padding: 12px 16px; border-top: 2px solid var(--grid); display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.list li:first-child { border-top: 0; }
.list .acc { font: 700 1rem var(--f-display); font-variant-numeric: tabular-nums; }
.box-title { padding: 12px 16px; border-bottom: var(--border) solid var(--ink); }
.mistake { display: grid !important; gap: 4px; justify-content: stretch !important; }
.mistake .was { color: var(--sub); font-size: .9375rem; }
.mistake .now { font-weight: 500; }
.mistake .now::before { content: "✓ "; font-weight: 700; }
.up { font: 700 .9375rem var(--f-display); }

/* ---------- overlay, loading ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px;
  background: color-mix(in srgb, var(--paper) 80%, transparent);
}
.stamp {
  display: grid; gap: 14px; justify-items: center; text-align: center; padding: 28px 30px; max-width: 360px;
  background: var(--mark); color: var(--on-color); border: 4px solid var(--ink); border-radius: 14px;
  box-shadow: 8px 8px 0 var(--shadow);
  animation: stamp .45s cubic-bezier(.2, 1.6, .4, 1) both;
}
.stamp .big { font: 800 2.75rem/1 var(--f-display); font-stretch: 78%; letter-spacing: .02em; text-transform: uppercase; border: 4px solid #000; padding: 6px 14px; transform: rotate(-4deg); }
.stamp .btn { color: var(--ink); }
@keyframes stamp { from { transform: scale(1.6) rotate(6deg); opacity: 0; } to { transform: none; opacity: 1; } }

.loading { min-height: 70vh; display: grid; place-items: center; text-align: center; }
.loading-inner { display: grid; gap: 18px; justify-items: center; }
.bar { width: min(280px, 80vw); height: 18px; border: var(--border) solid var(--ink); border-radius: 6px; overflow: hidden; background: var(--card); }
.bar span { display: block; height: 100%; width: 40%; background: var(--mark); border-right: var(--border) solid var(--ink); animation: slide 1.1s ease-in-out infinite alternate; }
@keyframes slide { from { transform: translateX(-10%); } to { transform: translateX(160%); } }
.error-box { padding: 20px; max-width: 520px; display: grid; gap: 10px; text-align: left; }
.error-box code { font-size: .9375rem; background: var(--paper); padding: 2px 6px; border-radius: 4px; }

.foot { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 10px 18px; justify-content: space-between; color: var(--sub); font-size: .8125rem; }
.foot button { font: inherit; color: inherit; background: none; border: 0; text-decoration: underline; cursor: pointer; min-height: 44px; padding: 0; }
.confirm { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main id="app" aria-live="off"></main>
<div id="announcer" class="sr-only" aria-live="polite"></div>
<script src="js/engine.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
