<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grammar to Band 9</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Visual grammar lessons and practice for IELTS, from Band 5 to Band 9.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Minimal: white page, one typeface, hairlines only where they separate things.
   Colour is reserved for meaning: soft role tints in lessons, green/red for answers,
   one blue for the next action and for progress. */
:root {
  --bg: #FFFFFF;
  --panel: #F6F7F8;
  --ink: #1D2024;
  --muted: #6A7078;
  --faint: #9AA0A7;
  --line: #E7E9EC;
  --accent: #2F5BEA;
  --accent-ink: #FFFFFF;
  --accent-soft: #EBF0FE;
  --ok: #1E8E57;
  --ok-soft: #E8F6EE;
  --bad: #CC3B3B;
  --bad-soft: #FCECEC;
  /* grammar roles: tint + text, fixed everywhere */
  --s-bg: #E6EDFF;   --s-ink: #2A55C9;
  --aux-bg: #FFEEDD; --aux-ink: #A85310;
  --v-bg: #FCE6EF;   --v-ink: #B1305F;
  --o-bg: #E7F4DA;   --o-ink: #3D7413;
  --x-bg: #EFEBFD;   --x-ink: #5A45C4;
  --c-bg: #DFF4F0;   --c-ink: #0D7466;
  --f: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161A; --panel: #1C1F24; --ink: #ECEDEF; --muted: #9CA2AA; --faint: #6C727A; --line: #2A2E35;
    --accent: #7C9BFF; --accent-ink: #0F1430; --accent-soft: #1E2744;
    --ok: #4CC98A; --ok-soft: #16301F; --bad: #FF7B7B; --bad-soft: #3A1E1F;
    --s-bg: #1E2A4A; --s-ink: #9DB6FF; --aux-bg: #3A2A18; --aux-ink: #FFC08A;
    --v-bg: #3B1F2C; --v-ink: #FF9EC3; --o-bg: #22331A; --o-ink: #A9DB7C;
    --x-bg: #2A2546; --x-ink: #C2B5FF; --c-bg: #15332F; --c-ink: #7FE0D0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14161A; --panel: #1C1F24; --ink: #ECEDEF; --muted: #9CA2AA; --faint: #6C727A; --line: #2A2E35;
  --accent: #7C9BFF; --accent-ink: #0F1430; --accent-soft: #1E2744;
  --ok: #4CC98A; --ok-soft: #16301F; --bad: #FF7B7B; --bad-soft: #3A1E1F;
  --s-bg: #1E2A4A; --s-ink: #9DB6FF; --aux-bg: #3A2A18; --aux-ink: #FFC08A;
  --v-bg: #3B1F2C; --v-ink: #FF9EC3; --o-bg: #22331A; --o-ink: #A9DB7C;
  --x-bg: #2A2546; --x-ink: #C2B5FF; --c-bg: #15332F; --c-ink: #7FE0D0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.6 var(--f); min-height: 100vh; }
#app {
  max-width: 880px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 20px 80px;
}
h1, h2, h3 { font-family: var(--f); margin: 0; text-wrap: balance; letter-spacing: -0.02em; }
h1 { font-size: clamp(1.75rem, 4.5vw, 2.5rem); font-weight: 600; line-height: 1.15; }
h2 { font-size: 1.125rem; font-weight: 600; line-height: 1.3; }
h3 { font-size: 1rem; font-weight: 600; line-height: 1.35; }
p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.slab { background: var(--bg); }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px;
  font: 500 .9375rem/1.1 var(--f); color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 8px; cursor: pointer; text-decoration: none;
  transition: background .15s ease, border-color .15s ease;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover { background: var(--panel); }
.btn[disabled] { color: var(--faint); cursor: not-allowed; background: transparent; }
.btn-mark, .btn-ink { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn-mark:hover, .btn-ink:hover { background: var(--ink); opacity: .88; }
.btn-xl { min-height: 52px; padding: 0 26px; font-size: 1rem; }
.btn-ghost { border-color: transparent; padding: 0 10px 0 0; color: var(--muted); }
.btn-ghost:hover { background: transparent; color: var(--ink); }
.count { color: var(--muted); font-variant-numeric: tabular-nums; }

/* role chips */
.chip { display: inline-block; padding: 6px 12px; border-radius: 6px; font: 500 1rem/1.3 var(--f); }
.r-s { background: var(--s-bg); color: var(--s-ink); }
.r-aux { background: var(--aux-bg); color: var(--aux-ink); }
.r-v { background: var(--v-bg); color: var(--v-ink); }
.r-o { background: var(--o-bg); color: var(--o-ink); }
.r-x { background: var(--x-bg); color: var(--x-ink); }
.r-c { background: var(--c-bg); color: var(--c-ink); }

/* masthead */
.masthead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 48px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1rem; text-decoration: none; letter-spacing: -0.01em; }
.brand-dots { display: inline-flex; gap: 3px; }
.brand-dots i { width: 6px; height: 18px; border-radius: 2px; }
.brand-dots i:nth-child(1) { background: var(--s-ink); }
.brand-dots i:nth-child(2) { background: var(--aux-ink); }
.brand-dots i:nth-child(3) { background: var(--v-ink); }
.icon-btn { width: 44px; padding: 0; border-color: transparent; color: var(--muted); font-size: 1.125rem; }

/* home */
.today { display: grid; gap: 32px; margin-bottom: 64px; }
.today-top { display: grid; gap: 28px; }
.hello p { color: var(--muted); margin-top: 10px; max-width: 48ch; }
.stats { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 12px 40px; margin: 0; }
.stat { display: flex; flex-direction: column; min-width: 0; }
.stat dd { margin: 0; order: -1; font: 500 1.75rem/1.1 var(--f); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat dd small { font-size: .55em; color: var(--faint); font-weight: 400; margin-left: 2px; }
.stat dt { font-size: .8125rem; color: var(--muted); }
.plan { display: grid; gap: 12px; }
.plan-strip { display: flex; gap: 4px; }
.plan-step { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.plan-step::before { content: ""; height: 4px; border-radius: 2px; background: var(--line); }
.plan-step:first-child::before { background: var(--accent); opacity: .35; }
.plan-step b { font-weight: 500; font-size: .875rem; }
.plan-step span { font-size: .8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.plan-note { font-size: .9375rem; color: var(--muted); }
.plan-note strong { color: var(--ink); font-weight: 500; }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
@media (max-width: 520px) {
  .plan-strip { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 8px; }
  .cta-row .btn { width: 100%; }
  .stats { gap: 12px 24px; }
}

.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.section-head p { color: var(--muted); font-size: .875rem; }
.suggest { margin-bottom: 64px; }
.suggest-row { display: grid; }
.suggest-card { display: grid; gap: 2px; padding: 16px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
.suggest-card:hover h3 { color: var(--accent); }
.suggest-card .why { font-size: .875rem; color: var(--muted); margin-top: 4px; }
.suggest-card .why strong { font-weight: 500; color: var(--ink); }

.band { margin-bottom: 56px; }
.band-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 1px solid var(--ink); }
.band-num { font-size: .875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.band-head h2 { order: -1; }
.band-head p { color: var(--muted); font-size: .875rem; margin-left: auto; font-variant-numeric: tabular-nums; }
.tiles { display: grid; column-gap: 40px; }
@media (min-width: 720px) { .tiles { grid-template-columns: 1fr 1fr; } }
.tile {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 16px; align-items: center;
  padding: 14px 0; min-height: 64px; border-bottom: 1px solid var(--line); text-decoration: none;
}
.tile-title { grid-column: 1; font-weight: 500; line-height: 1.35; }
.tile:hover .tile-title { color: var(--accent); }
.tile-vi { grid-column: 1; font-size: .8125rem; color: var(--muted); line-height: 1.4; }
.tile-foot { grid-column: 2; grid-row: 1 / span 3; display: flex; align-items: center; gap: 10px; }
.prio, .tile .refresh { grid-column: 1; font-size: .75rem; margin-top: 2px; }
.prio { order: 5; color: var(--bad); }
.ring { width: 22px; height: 22px; flex: none; }
.ring .track { stroke: var(--line); }
.ring .fill { stroke: var(--accent); }
.badge { font-size: .8125rem; color: var(--muted); white-space: nowrap; }
.badge.lvl-0 { color: var(--faint); }
.badge.lvl-2 { color: var(--ink); }
.badge.lvl-3 { color: var(--accent); font-weight: 500; }
.refresh { font-size: .8125rem; color: var(--muted); }

/* lesson */
.back { margin-bottom: 24px; }
.lesson { display: grid; gap: 40px; }
.lesson > *, .stage > *, .summary > *, .today > *, .pair > * { min-width: 0; }
.lesson-head { display: grid; gap: 8px; }
.lesson-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; color: var(--muted); font-size: .875rem; }
.lesson-meta .band-num { color: var(--muted); }
.lesson-vi { color: var(--muted); }
.rule { font-size: 1.1875rem; line-height: 1.6; max-width: 58ch; }
.machine { display: grid; gap: 28px; }
.machine-label { font-size: .8125rem; color: var(--muted); }
.formula { display: flex; flex-wrap: wrap; gap: 16px 8px; align-items: flex-start; }
.part { display: flex; flex-direction: column; gap: 6px; }
.part .chip { font-size: 1.125rem; padding: 10px 14px; }
.part small { font-size: .75rem; color: var(--faint); padding-left: 2px; }
.formula + .formula { padding-top: 24px; border-top: 1px solid var(--line); }

.timeline svg { width: 100%; max-width: 720px; height: auto; display: block; color: var(--ink); overflow: visible; }
.timeline text { font-family: var(--f); font-weight: 500; }
.timeline text.end { font-weight: 400; }
.tl-wrap { overflow-x: auto; }
.tl-wrap svg { min-width: 300px; }

.pair { display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.example { padding-left: 16px; border-left: 2px solid var(--line); }
.example.wrong { border-color: var(--bad); }
.example.right { border-color: var(--ok); }
.example-head { font-size: .8125rem; font-weight: 500; margin-bottom: 6px; }
.example.wrong .example-head { color: var(--bad); }
.example.right .example-head { color: var(--ok); }
.example p { font-size: 1.1875rem; line-height: 1.55; }
.example del { text-decoration: line-through 2px var(--bad); background: var(--bad-soft); padding: 0 3px; border-radius: 3px; }
.example ins { text-decoration: none; background: var(--ok-soft); color: var(--ok); padding: 0 3px; border-radius: 3px; font-weight: 500; }

.tip { max-width: 58ch; padding: 16px 18px; background: var(--panel); border-radius: 10px; color: var(--ink); }
.tip b { display: block; font-size: .8125rem; font-weight: 500; color: var(--muted); margin-bottom: 4px; }
.lesson-actions { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
.lesson-actions p { color: var(--muted); font-size: .875rem; }

/* practice */
.sbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 0 0; margin-bottom: 32px; background: var(--bg);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.sbar .btn { min-height: 40px; padding: 0 12px; border-color: transparent; color: var(--muted); margin-left: -12px; }
.sbar .btn:hover { color: var(--ink); background: var(--panel); }
.sbar .where { flex: 1 1 140px; min-width: 0; }
.sbar .where b { display: block; font-weight: 500; font-size: .9375rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sbar .where span { font-size: .8125rem; color: var(--muted); }
.meters { display: flex; gap: 20px; }
.meter { text-align: right; }
.meter b { display: block; font-weight: 500; font-size: .9375rem; font-variant-numeric: tabular-nums; }
.meter span { font-size: .75rem; color: var(--muted); }
.phases { display: flex; gap: 4px; width: 100%; padding-top: 6px; }
.phases span { flex: 1; height: 3px; border-radius: 2px; background: var(--line); }
.phases span.done { background: var(--ink); opacity: .5; }
.phases span.now { background: var(--accent); }
.sbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 1px; background: var(--line); }

.stage { max-width: 680px; margin: 0 auto; display: grid; gap: 24px; }
.qcard { display: grid; gap: 24px; }
.qtop { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; }
.qkind { font-size: .875rem; font-weight: 500; color: var(--muted); }
.qtopic { font-size: .8125rem; color: var(--faint); margin-left: auto; }
.review-tag { font-size: .8125rem; color: var(--x-ink); }
.prompt { font-size: clamp(1.25rem, 3.4vw, 1.5rem); line-height: 1.5; font-weight: 400; letter-spacing: -0.01em; }
.prompt.small { font-size: 1rem; color: var(--muted); }
.gap { display: inline-block; min-width: 3em; border-bottom: 2px solid var(--ink); text-align: center; line-height: 1.15; padding: 0 4px; }
.gap.filled { border-color: var(--ok); color: var(--ok); font-weight: 500; }
.prompt mark { background: var(--bad-soft); color: var(--bad); border-radius: 4px; padding: 0 4px; text-decoration: underline wavy var(--bad); text-underline-offset: 4px; }

.opts { display: grid; gap: 10px; }
.opts.two { grid-template-columns: 1fr 1fr; }
@media (min-width: 600px) { .opts.short { grid-template-columns: 1fr 1fr; } }
.opt {
  display: flex; align-items: center; gap: 14px; text-align: left;
  min-height: 56px; padding: 10px 16px;
  font: 400 1.0625rem/1.4 var(--f); color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
  transition: border-color .15s ease, background .15s ease;
  -webkit-tap-highlight-color: transparent;
}
.opt:hover:not([disabled]) { border-color: var(--faint); background: var(--panel); }
.opt kbd { flex: none; font: 500 .8125rem/1 var(--f); color: var(--faint); width: 14px; }
.opt .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt .verdict { flex: none; font-size: .8125rem; font-weight: 500; }
.opt[disabled] { cursor: default; }
.opt.dim { color: var(--faint); }
.opt.is-right { background: var(--ok-soft); border-color: var(--ok); }
.opt.is-right .verdict { color: var(--ok); }
.opt.is-wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt.is-wrong .verdict { color: var(--bad); }
.opt.judge { justify-content: center; font-weight: 500; }

.typed { display: flex; gap: 10px; flex-wrap: wrap; }
.typed input {
  flex: 1 1 220px; min-width: 0; min-height: 52px; padding: 0 16px;
  font: 400 1.125rem var(--f); color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px;
}
.typed input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.typed input.is-right { background: var(--ok-soft); border-color: var(--ok); }
.typed input.is-wrong { background: var(--bad-soft); border-color: var(--bad); }

.feedback { display: grid; gap: 12px; }
.feedback:empty { display: none; }
.verdict-line { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 1.0625rem; }
.verdict-line i { font-style: normal; }
.verdict-line.good { color: var(--ok); }
.verdict-line.bad { color: var(--bad); }
.fixed { padding: 12px 14px; background: var(--panel); border-radius: 8px; font-size: 1.0625rem; }
.fixed small { display: block; font-size: .75rem; color: var(--muted); }
.explain { color: var(--muted); max-width: 62ch; }
.next-row { display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap; }
.next-row .hint { margin-right: auto; align-self: center; font-size: .8125rem; color: var(--faint); }
@media (max-width: 520px) {
  .next-row .btn { width: 100%; }
  .next-row .hint { display: none; }
  .meters { gap: 14px; }
}
@media (hover: none) { .hint { display: none; } }

/* summary */
.summary { max-width: 680px; margin: 0 auto; display: grid; gap: 40px; }
.list { display: grid; padding: 0; margin: 0; list-style: none; }
.list li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; justify-content: space-between; align-items: baseline; flex-wrap: wrap; }
.list a { text-decoration: none; }
.list a:hover { color: var(--accent); }
.list .acc { color: var(--muted); font-variant-numeric: tabular-nums; }
.box-title { padding-bottom: 8px; border-bottom: 1px solid var(--ink); }
.mistake { display: grid !important; gap: 2px; }
.mistake .was { color: var(--muted); font-size: .9375rem; text-decoration: line-through; text-decoration-color: var(--bad); }
.mistake .now::before { content: "✓ "; color: var(--ok); }
.up { font-size: .9375rem; color: var(--muted); }

/* overlay, loading */
.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px; background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(4px); }
.stamp {
  display: grid; gap: 14px; justify-items: center; text-align: center; padding: 32px 28px; max-width: 360px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: 0 20px 50px rgba(20, 24, 40, .12);
  animation: rise .35s ease-out both;
}
.stamp .big { font-size: 1.5rem; font-weight: 600; color: var(--accent); }
.stamp .big::before { content: "★ "; }
.stamp p { color: var(--muted); }
.stamp strong { color: var(--ink); font-weight: 500; }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

.loading { min-height: 70vh; display: grid; place-items: center; text-align: center; }
.loading-inner { display: grid; gap: 20px; justify-items: center; color: var(--muted); }
.bar { width: min(220px, 70vw); height: 3px; border-radius: 2px; overflow: hidden; background: var(--line); }
.bar span { display: block; height: 100%; width: 35%; background: var(--accent); animation: slide 1.1s ease-in-out infinite alternate; }
@keyframes slide { from { transform: translateX(-20%); } to { transform: translateX(210%); } }
.error-box { max-width: 520px; display: grid; gap: 12px; text-align: left; }
.error-box code { font-size: .9375rem; background: var(--panel); padding: 2px 6px; border-radius: 4px; }

.foot { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px 20px; justify-content: space-between; color: var(--faint); font-size: .8125rem; }
.foot button { font: inherit; color: var(--muted); background: none; border: 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; min-height: 44px; padding: 0; }
#sync-status[data-state="synced"]::before, #sync-status[data-state="saving"]::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin-right: 8px; vertical-align: middle; }
#sync-status[data-state="unreachable"], #sync-status[data-state="error"] { color: var(--bad); }
.confirm { display: inline-flex; gap: 10px; align-items: center; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main id="app" aria-live="off"></main>
<div id="announcer" class="sr-only" aria-live="polite"></div>
<script src="js/engine.js"></script>
<script src="js/store.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
